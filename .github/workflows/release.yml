name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Verify checks
              run: pnpm check

            - name: Run tests
              run: pnpm exec vp test

            # Linux x64 single executable. Web assets, fonts, and the libSQL
            # native runtime are embedded and extracted on first launch.
            - name: Build single executable
              run: pnpm build:sea

            - name: Smoke-test the executable
              run: pnpm smoke:sea

            - name: Generate checksum
              run: sha256sum dist/relay > dist/relay.sha256

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/relay
                      dist/relay.sha256
                  generate_release_notes: true
